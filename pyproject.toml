[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trade-nexus"
version = "1.0.0"
description = "Backtesting and paper trading engine utilizing ML models (XGBoost/LSTM) to predict asset prices and execute mock trades."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
